name: Windows retrieval package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build and test dependencies
        run: python -m pip install -r apps/engine/backend/requirements-build.txt -r apps/engine/backend/requirements-dev.txt
      - name: Check generated contracts
        run: python scripts/validate-search-contracts.py
      - name: Run offline unit tests
        run: python -m pytest -m "not browser"
      - name: Run AI-Core systems tests
        run: python -m pytest tests/systems -q
      - name: Install Chromium
        run: python -m playwright install chromium --no-shell
      - name: Test browser boundaries
        run: python -m pytest -m browser --run-browser
      - name: Build native package and run its offline smoke check
        run: python scripts/build-sidecar.py --target windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-engine-windows-x64
          path: dist/sidecar/windows-x64/nexus-engine/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  verify-package:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nexus-engine-windows-x64
          path: package
      - name: Run without Python or developer browser cache on PATH
        shell: pwsh
        run: |
          $engine = Join-Path $env:GITHUB_WORKSPACE 'package/nexus-engine.exe'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:RUNNER_TEMP 'empty-browser-cache'
          Set-Location $env:RUNNER_TEMP
          & $engine --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged engine smoke check failed' }
